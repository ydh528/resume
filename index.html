<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>游德慧 · 个人网站</title>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <!-- 国内 CDN 加载 React & Babel -->
  <script crossorigin src="https://cdn.bootcdn.net/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.bootcdn.net/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    /* ===== 全局重置 & 自定义光标 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none; /* 隐藏默认鼠标 */
    }
    html, body { overflow-x: hidden; max-width: 100vw; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #fcf7f0;
      color: #3d2c1e;
      line-height: 1.6;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    img {
      max-width: 100%;
      display: block;
      height: auto;
    }
    .container {
      width: 100%;
      padding: 0 1.2rem;
      max-width: 1700px;
      margin: 0 auto;
    }
    /* ===== 工具 ===== */
    .section-title {
      font-size: 2.0rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #b27a4a;
      margin-bottom: 2rem;
      position: relative;
      display: inline-block;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 50px;
      height: 3px;
      background: #dbb58b;
      border-radius: 4px;
    }
    .card {
      background: rgba(255, 248, 240, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 1.5rem 1.2rem;
      border: 1px solid rgba(230, 200, 170, 0.2);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    /* ===== 导航栏 ===== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: rgba(12, 30, 48, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(245, 230, 200, 0.1);
    }
    .navbar .logo {
      font-size: 1.1rem;
      font-weight: 300;
      color: #f5e6c8;
      letter-spacing: 0.08em;
    }
    .navbar .logo span {
      font-weight: 500;
      color: #f5e6c8;
    }
    .nav-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .nav-links a {
      font-size: 0.85rem;
      font-weight: 350;
      color: #c0d0e0;
      transition: color 0.2s;
      position: relative;
      white-space: nowrap;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 2px;
      background: #f5e6c8;
      transition: width 0.25s;
    }
    .nav-links a:hover {
      color: #f5e6c8;
    }
    .nav-links a:hover::after {
      width: 100%;
    }

    /* ============================================================
       Hero — 深空蓝，顶部标签横向排列，按钮居中
       ============================================================ */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0c1e30;
      background: radial-gradient(ellipse at 50% 60%, #1a3a5a 0%, #0a1a2e 100%);
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: overlay;
    }

    .hero-stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(1.5px 1.5px at 12% 23%, rgba(255,255,240,0.7), transparent),
                        radial-gradient(1px 1px at 34% 67%, rgba(255,255,240,0.5), transparent),
                        radial-gradient(2px 2px at 56% 12%, rgba(255,255,240,0.8), transparent),
                        radial-gradient(1px 1px at 78% 84%, rgba(255,255,240,0.4), transparent),
                        radial-gradient(1.5px 1.5px at 90% 36%, rgba(255,255,240,0.6), transparent),
                        radial-gradient(1px 1px at 25% 90%, rgba(255,255,240,0.3), transparent),
                        radial-gradient(1px 1px at 70% 45%, rgba(255,255,240,0.5), transparent);
      background-size: 200px 200px;
      opacity: 0.8;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      padding: 0 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeUp 0.8s ease-out;
      margin-top: -2vh;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #c0d0e0;
      text-shadow: 0 0 8px rgba(192, 208, 224, 0.2);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(245, 230, 200, 0.15);
      padding-bottom: 1rem;
    }
    .hero-tags span {
      color: #f5e6c8;
      text-shadow: 0 0 12px rgba(245, 230, 200, 0.3);
    }

    .hero-name-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 1.2rem;
    }
    .hero-avatar {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(245, 230, 200, 0.6);
      box-shadow:
        0 0 20px rgba(245, 230, 200, 0.3),
        0 4px 16px rgba(0, 0, 0, 0.4);
      animation: avatarFloat 4s ease-in-out infinite alternate;
    }
    @keyframes avatarFloat {
      from { transform: translateY(0); }
      to   { transform: translateY(-6px); }
    }
    .hero-name {
      font-family: 'Poppins', 'Montserrat', system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(3.6rem, 14vw, 7rem);
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(245, 230, 200, 0.8),
        0 0 20px rgba(245, 230, 200, 0.6),
        0 0 40px rgba(245, 230, 200, 0.4),
        0 0 80px rgba(245, 230, 200, 0.2);
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
      text-stroke: 1px rgba(255, 255, 255, 0.2);
      animation: glitch 3s infinite alternate ease-in-out;
      margin-bottom: 0;
    }
    @media (max-width: 640px) {
      .hero-avatar { width: 60px; height: 60px; }
      .hero-name-row { gap: 14px; }
    }

    .hero-slogan {
      font-size: clamp(1.8rem, 7vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f5e6c8;
      text-shadow: 0 0 15px rgba(245, 230, 200, 0.3);
      margin-bottom: 1.8rem;
      opacity: 0.9;
    }

    .hero-desc {
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      font-weight: 300;
      color: #c0d0e0;
      max-width: 700px;
      line-height: 1.8;
      margin-bottom: 2rem;
      opacity: 0.85;
      text-shadow: 0 0 8px rgba(192, 208, 224, 0.1);
      text-align: left;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      justify-content: center;
      width: 100%;
    }
    .hero-btn {
      display: inline-block;
      padding: 0.6rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #f5e6c8;
      background: transparent;
      border: 1px solid rgba(245, 230, 200, 0.4);
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 12px rgba(245, 230, 200, 0.05);
    }
    .hero-btn:hover {
      background: #f5e6c8;
      color: #0c1e30;
      border-color: #f5e6c8;
      box-shadow: 0 0 24px rgba(245, 230, 200, 0.3);
      transform: translateY(-2px);
    }
    .hero-btn:active {
      transform: scale(0.97);
    }
    .hero-btn-secondary {
      border-color: rgba(245, 230, 200, 0.25);
    }
    .hero-btn-secondary:hover {
      background: #f5e6c8;
      color: #0c1e30;
      border-color: #f5e6c8;
    }
    .hero-contact {
      display: flex;
      gap: 2rem;
      margin-top: 1.2rem;
      font-size: 0.9rem;
      color: #f5e6c8;
      letter-spacing: 0.03em;
    }
    .hero-contact-item { white-space: nowrap; }

    .scroll-wrapper {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
      color: #f5e6c8;
      font-family: 'Poppins', 'Montserrat', system-ui, sans-serif;
    }
    .scroll-en {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      font-weight: 300;
      opacity: 0.5;
      text-shadow: 0 0 10px rgba(245, 230, 200, 0.2);
      animation: blinkPulse 2s infinite alternate;
    }
    .scroll-cn {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 300;
      opacity: 0.4;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }
    .scroll-cn span {
      animation: floatUp 2.4s infinite alternate ease-in-out;
    }
    .scroll-cn span:nth-child(2) { animation-delay: 0.2s; }
    .scroll-cn span:nth-child(3) { animation-delay: 0.4s; }
    .scroll-cn span:nth-child(4) { animation-delay: 0.6s; }

    @keyframes blinkPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }
    @keyframes floatUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    @keyframes glitch {
      0% { transform: translate(0, 0) skewX(0deg); }
      10% { transform: translate(-1px, 1px) skewX(-0.5deg); }
      20% { transform: translate(1px, -1px) skewX(0.5deg); }
      30% { transform: translate(-1px, 0px) skewX(0.2deg); }
      40% { transform: translate(0px, 1px) skewX(-0.2deg); }
      50% { transform: translate(0, 0) skewX(0deg); }
      60% { transform: translate(-2px, 0px) skewX(1deg); }
      70% { transform: translate(2px, 0px) skewX(-1deg); }
      80% { transform: translate(-0.5px, -0.5px) skewX(0deg); }
      90% { transform: translate(0.5px, 0.5px) skewX(0.3deg); }
      100% { transform: translate(0, 0) skewX(0deg); }
    }

    /* ============================================================
       学术根基卡片样式
       ============================================================ */
    .academic-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem 2.2rem;
      box-shadow: 0 8px 30px rgba(160, 130, 100, 0.10);
      border: 1px solid rgba(230, 210, 190, 0.3);
      max-width: 700px;
      margin: 0 auto;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .academic-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(160, 130, 100, 0.15);
    }
    .academic-quote {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 300;
      line-height: 1.3;
      color: #3d2c1e;
      margin-bottom: 1.5rem;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #e6d6c4;
      padding-bottom: 1rem;
    }
    .academic-quote div:first-child {
      font-weight: 500;
      color: #b27a4a;
      font-family: "华文行楷", "STXingkai", "KaiTi", "楷体", cursive, "STKaiti", "华文楷体", serif;
    }
    .academic-quote div:last-child {
      font-weight: 700;
      color: #ffffff;
      -webkit-text-stroke: 1.5px #000000;
      text-stroke: 1.5px #000000;
      font-size: 0.8em;
      letter-spacing: 0.12em;
      text-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
    .academic-info {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 1rem;
      padding: 0.4rem 0;
      border-bottom: 1px dashed #e6d6c4;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-row .label {
      font-weight: 500;
      color: #6a5543;
      letter-spacing: 0.04em;
    }
    .info-row .value {
      font-weight: 400;
      color: #3d2c1e;
      text-align: right;
      max-width: 60%;
    }

    /* ===== 其他模块 ===== */
    section {
      padding: 3.5rem 0;
    }
    .section-inner {
      width: 100%;
      padding: 0 1.2rem;
      max-width: 1700px;
      margin: 0 auto;
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.8rem;
    }
    .project-card {
      border-radius: 24px;
      overflow: hidden;
      background: #fffaf5;
      box-shadow: 0 6px 20px rgba(160,120,80,0.08);
      transition: all 0.3s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(160,120,80,0.12);
    }
    .project-img {
      width: 100%;
      aspect-ratio: 16/10;
      background: #dccfc0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: #8a765e;
      border-top-left-radius: inherit;
      border-top-right-radius: inherit;
      overflow: hidden;
    }
    .project-body {
      padding: 1.2rem 1.2rem 1.5rem;
    }
    .project-body h3 {
      font-weight: 400;
      font-size: 1.2rem;
      color: #3d2c1e;
      margin-bottom: 0.2rem;
    }
    .project-body .desc {
      color: #5f4a36;
      opacity: 0.8;
      font-size: 0.9rem;
    }

    /* ===== 可试玩卡片样式 ===== */
    .project-card.playable {
      cursor: pointer;
      position: relative;
    }
    .project-card.playable .playable-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(232, 90, 26, 0.9);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(232, 90, 26, 0.4);
    }
    .project-card.playable:hover .playable-badge {
      transform: scale(1.15) rotate(12deg);
      background: #ff6b1a;
    }

    /* ===== 游戏内嵌模态框 ===== */
    .game-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: auto !important; /* 覆盖全局 cursor:none */
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: gameFadeIn 0.3s ease forwards;
    }
    @keyframes gameFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .game-modal-content {
      position: relative;
      width: 90vw;
      height: 85vh;
      max-width: 1200px;
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    .game-modal iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Loading 加载动画 */
    .game-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #111;
      z-index: 2;
      transition: opacity 0.4s ease;
    }
    .game-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .game-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e85a1a;
      border-radius: 50%;
      animation: gameSpin 0.8s linear infinite;
    }
    @keyframes gameSpin {
      to { transform: rotate(360deg); }
    }
    .game-loading-text {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      font-family: 'Noto Sans SC', sans-serif;
    }
    /* 关闭按钮 */
    .game-close {
      position: fixed;
      top: 160px;
      right: 30px;
      z-index: 100001;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .game-close:hover {
      background: #e85a1a;
      transform: rotate(90deg);
      border-color: #e85a1a;
    }

    /* 游戏弹窗右上角关闭按钮（高对比度醒目版）—— 固定在音乐播放器正下方 */
    .game-modal-close {
      position: fixed;
      top: 160px;
      right: 30px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
      cursor: pointer !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 100001;
    }
    .game-modal-close:hover {
      background: #ff4d4f;
      border-color: #ff4d4f;
      color: #ffffff;
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 0 15px rgba(255, 77, 79, 0.6);
    }

    /* ===== 双视频展示模态框 ===== */
    .video-black-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      animation: videoFadeIn 0.3s ease forwards;
    }
    @keyframes videoFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .video-modal-content {
      position: relative;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      padding: 1rem;
    }
    .modal-video-item {
      width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      background: #000;
      display: block;
    }
    .video-modal-close {
      position: fixed;
      top: 160px;
      right: 30px;
      z-index: 100001;
      width: 44px;
      height: 44px;
      margin-bottom: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .video-modal-close:hover {
      background: #ff4d4f;
      border-color: #ff4d4f;
      color: #ffffff;
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 0 15px rgba(255, 77, 79, 0.6);
    }

    /* ===== 实战卡片：可点击试玩角标 ===== */
    .practice-play-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(232, 90, 26, 0.9);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(232, 90, 26, 0.4);

    /* ===== 证书勋章（影院深蓝胶卷风格） ===== */
    /* 参考图风格：深蓝渐变背景 + 黑色方齿孔胶卷 + 水平卡片（完整展示） + 左右箭头 */

    /* 板块外层 — 整个证书勋章区改为深蓝影院底（独立，不影响父板块） */
    .cert-cinema-wrap {
      position: relative;
      margin-top: 1.5rem;
      padding: 3rem 1.2rem 3.2rem;
      border-radius: 28px;
      background: radial-gradient(ellipse at 50% 20%, #1d3a6b 0%, #0e2145 48%, #050b1a 100%);
      box-shadow:
        0 30px 70px rgba(10, 20, 50, 0.55),
        inset 0 0 0 1px rgba(120, 170, 255, 0.08);
      overflow: visible;
    }
    /* 角落暗角 vignette */
    .cert-cinema-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
      border-radius: 28px;
    }

    /* 子标题（"专业认证 // 03" 风格） */
    .cert-subtitle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      color: #d6e4ff;
      margin: 0 0 2.4rem;
    }
    .cert-subtitle::before,
    .cert-subtitle::after {
      content: '';
      flex: 0 0 auto;
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(170, 200, 255, 0.55), transparent);
    }
    .cert-subtitle-label {
      color: #ffffff;
      font-weight: 500;
      letter-spacing: 0.2em;
    }
    .cert-subtitle-num {
      color: #3f6cff;
      font-weight: 600;
      letter-spacing: 0.25em;
    }
    .cert-hint {
      text-align: center;
      font-size: 0.82rem;
      color: rgba(200, 220, 255, 0.55);
      letter-spacing: 0.12em;
      margin: -1.4rem 0 1.8rem;
    }

    /* 滚动舞台：让卡片完整展示 */
    .cert-stage {
      position: relative;
      padding: 0.5rem 0 2.5rem;
    }
    /* 外层：只负责提供空间，不裁切 */
    .cert-film {
      position: relative;
      overflow: visible;
    }
    /* 内层：负责横向滚动 */
    .cert-film-scroll {
      overflow-x: auto;
      overflow-y: visible;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
      padding: 2.5rem 0 3rem;
    }
    .cert-film-scroll::-webkit-scrollbar { display: none; }

    /* 真实胶卷：黑色长条 + 内部方形齿孔（上下，不溢出容器） */
    .cert-film-track {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 0;
      padding: 28px 3.5rem;
      background: #0a0a0a;
      border-radius: 6px;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      width: max-content;
    }
    /* 顶部齿孔带（在内部，方孔） */
    .cert-film-track::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 0;
      height: 28px;
      background: repeating-linear-gradient(
        90deg,
        #1a1a1a 0 10px,
        #0a0a0a 10px 22px
      );
      border-bottom: 1px solid rgba(255,255,255,0.06);
      pointer-events: none;
    }
    /* 底部齿孔带（在内部，方孔） */
    .cert-film-track::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      bottom: 0;
      height: 28px;
      background: repeating-linear-gradient(
        90deg,
        #1a1a1a 0 10px,
        #0a0a0a 10px 22px
      );
      border-top: 1px solid rgba(255,255,255,0.06);
      pointer-events: none;
    }

    /* 单张证书卡片：水平展示，完整可见 */
    .cert-card {
      position: relative;
      flex-shrink: 0;
      width: 280px;
      margin: 0 14px;
      padding: 0.75rem 0.75rem 0.9rem;
      background: #fbfbfb;
      border-radius: 6px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: zoom-in;
      user-select: none;
    }
    .cert-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(120, 180, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }
    /* 证书图片区：完整显示，不裁切 */
    .cert-card-img {
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }
    .cert-card-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      display: block;
    }
    .cert-card-title {
      text-align: center;
      margin-top: 0.7rem;
      font-size: 0.86rem;
      color: #222;
      letter-spacing: 0.04em;
      font-weight: 450;
      line-height: 1.45;
    }

    /* 左右翻页箭头按钮 */
    .cert-arrow {
      position: absolute;
      bottom: 1.6rem;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(20, 28, 50, 0.7);
      border: 1px solid rgba(170, 200, 255, 0.18);
      color: #e8f0ff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      z-index: 5;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .cert-arrow:hover {
      background: rgba(60, 100, 200, 0.85);
      border-color: rgba(180, 210, 255, 0.55);
      transform: translateY(-2px);
    }
    .cert-arrow.left  { left:  calc(50% - 120px); }
    .cert-arrow.right { right: calc(50% - 120px); }

    /* ===== 模态框（匹配深蓝影院风格） ===== */
    .cert-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(5, 10, 24, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;

    .cert-modal.open {

    .cert-modal-inner {

    .cert-modal-close:hover {

    .cert-modal-img {

    /* ===== 实战展示（深色卡片 · 参考图风格） ===== */
    /* 头部：子标签 + 大标题 */
    .practice-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #1a1a1a;
      margin-bottom: 1.1rem;
    }
    .practice-kicker-icon {
      width: 16px; height: 16px;
      background: #e85a1a;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }
    .practice-kicker-slash { color: #c9c9c9; font-weight: 400; }
    .practice-kicker-cn {
      letter-spacing: 0.5em;
      font-weight: 500;
      color: #6a6a6a;
    }
    .practice-main-title {
      font-family: 'Poppins', 'Noto Sans SC', sans-serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 5.5vw, 3.6rem);
      line-height: 1.15;
      color: #111111;
      margin: 0 0 3rem;
    }
    .practice-main-title .practice-dot {
      color: #e85a1a;
      margin-left: 4px;
    }

    /* 太空蓝卡片容器 */
    .practice-card-group {
      background: #0B1A3A;
      border-radius: 24px;
      padding: 1.8rem 1.4rem;
      box-shadow:
        0 40px 80px rgba(11, 26, 58, 0.45),
        0 10px 30px rgba(0, 0, 0, 0.22);
    }
    .practice-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1.2rem 2rem;
      padding: 2rem 1.1rem;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      transition: background-color 0.3s ease;
    }
    /* 底部细分割线（最后一项不显示） */
    .practice-item + .practice-item::before {
      content: '';
      position: absolute;
      left: 1.1rem; right: 1.1rem;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      z-index: 1;
    }

    /* 大号空心编号 01 / 02 / 03 */
    .practice-num {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.55);
      text-stroke: 2px rgba(255, 255, 255, 0.55);
      letter-spacing: -0.02em;
      user-select: none;
      position: relative;
      z-index: 3;
      transition: -webkit-text-stroke-color 0.35s ease, color 0.35s ease;
    }

    /* 标题行 */
    .practice-meta { display: flex; flex-direction: column; gap: 0.7rem; min-width: 0; position: relative; z-index: 3; }
    .practice-en-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(1.3rem, 2.6vw, 2.1rem);
      letter-spacing: 0.01em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.2;
      word-break: break-word;
      transition: color 0.35s ease;
    }
    .practice-cn-sub {
      color: rgba(220, 220, 220, 0.78);
      font-size: clamp(0.88rem, 1.5vw, 1rem);
      letter-spacing: 0.04em;
      line-height: 1.55;
      transition: color 0.35s ease;
    }

    /* 日期 */
    .practice-date {
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      font-size: clamp(0.88rem, 1.4vw, 1rem);
      letter-spacing: 0.15em;
      color: rgba(200, 200, 200, 0.85);
      white-space: nowrap;
      position: relative;
      z-index: 3;
      transition: color 0.35s ease;
    }

    /* ===== 白色渐变遮罩层 ===== */
    .practice-mask {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.97) 0%, rgba(245,245,250,0.93) 100%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  height 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    /* hover 激活：遮罩从中心展开覆盖整个卡片 */
    .practice-item:hover .practice-mask {
      width: 300%;
      height: 600%;
    }

    /* ===== 字体反色（hover 时文字变深色） ===== */
    .practice-item:hover .practice-num {
      -webkit-text-stroke-color: rgba(11, 26, 58, 0.7);
    }
    .practice-item:hover .practice-en-title {
      color: #0B1A3A;
    }
    .practice-item:hover .practice-cn-sub {
      color: #3a3a3a;
    }
    .practice-item:hover .practice-date {
      color: #555;
    }

    /* ===== 触碰点旋转弹出图片 ===== */
    .practice-popimg {
      position: absolute;
      left: 0;
      top: 0;
      width: 140px;
      height: 140px;
      border-radius: 12px;
      border: 2px dashed rgba(11, 26, 58, 0.4);
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: rgba(11, 26, 58, 0.5);
      letter-spacing: 0.1em;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0) rotate(-30deg);
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: left, top, transform, opacity;
      overflow: hidden;
    }
    .practice-popimg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
    /* hover 激活：弹性弹出（含 popimg 内部 hover 时保持可见） */
    .practice-item:hover .practice-popimg,
    .practice-item.popimg-hover .practice-popimg {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }

    /* 响应式：窄屏时日期换行到下 */
    @media (max-width: 600px) {
      .practice-item {
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto auto;
      }
      .practice-num { grid-column: 1 / 2; grid-row: 1 / 3; align-self: start; }
      .practice-meta { grid-column: 2 / 3; grid-row: 1 / 2; }
      .practice-date { grid-column: 2 / 3; grid-row: 2 / 3; text-align: left; }
      .practice-card-group { padding: 1.2rem 1rem; border-radius: 18px; }
      .practice-item { padding: 1.6rem 0.6rem; }
      .practice-popimg { width: 100px; height: 100px; }
    }

    /* ===== PPT展示模块：入口卡片 + 全屏无限画布 ===== */

    /* ===== 自媒体账号展示 ===== */
    .media-section {
      background: #f8f4ed;
      padding: 5rem 0;
      position: relative;
    }
    .media-grid {
      display: grid;

    /* —— 入口卡片（点击进入全屏画布） —— */
    .ppt-entry-card {
      position: relative;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      background: linear-gradient(135deg, #0c1630 0%, #12244a 45%, #0a1635 100%);
      overflow: hidden;
      cursor: default;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 30px 80px rgba(10, 20, 50, 0.25),
                  0 10px 30px rgba(10, 20, 50, 0.18);
      user-select: none;
    }
    .ppt-entry-card::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 180, 100, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(100, 180, 255, 0.18) 0%, transparent 50%);
      pointer-events: none;
    }
    .ppt-entry-card:hover {
      transform: translateY(-6px) scale(1.012);
      box-shadow: 0 42px 110px rgba(10, 20, 50, 0.32),
                  0 18px 45px rgba(232, 90, 26, 0.18);
    }
    .ppt-entry-inner {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      padding: 3rem;
      text-align: center;
    }
    .ppt-entry-count {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      color: rgba(245, 230, 200, 0.6);
      text-transform: uppercase;
    }
    .ppt-entry-title {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: #fff5e6;
      line-height: 1.2;
    }
    .ppt-entry-sub {
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      color: rgba(245, 230, 200, 0.72);
      letter-spacing: 0.15em;
    }
    .ppt-entry-hint {
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 1.2rem;
      border: 1px solid rgba(245, 230, 200, 0.25);
      border-radius: 30px;
      font-size: 0.8rem;
      color: rgba(245, 230, 200, 0.8);
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .ppt-entry-card:hover .ppt-entry-hint,
    .ppt-entry-hint:hover,
    .ppt-entry-hint:focus-visible {
      border-color: #e85a1a;
      background: rgba(232, 90, 26, 0.15);
      color: #ffd9b8;
      outline: none;
    }
    .ppt-entry-hint-arrow {
      transition: transform 0.3s ease;
    }
    .ppt-entry-card:hover .ppt-entry-hint-arrow,
    .ppt-entry-hint:hover .ppt-entry-hint-arrow,
    .ppt-entry-hint:focus-visible .ppt-entry-hint-arrow {
      transform: translateX(4px);
    }

    /* —— 全屏画布 Modal —— */
    .ppt-canvas-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #070a14;
      overflow: hidden;
      cursor: default !important;  /* 强制覆盖全局 cursor:none，防止鼠标消失 */
      opacity: 0;
      transform-origin: center center;
      transition: opacity 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1),
                  clip-path 0.7s cubic-bezier(0.22, 0.61, 0.36, 1),
                  border-radius 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform, clip-path, border-radius;
    }
    .ppt-canvas-overlay.is-entering {
      /* 入场 FLIP：与 entry-card 大小位置匹配的起始态，由 JS 设置 inline style */
    }
    .ppt-canvas-overlay.is-open {
      opacity: 1;
      transform: scale(1);
      clip-path: inset(0 0 0 0 round 0);
      border-radius: 0;
    }
    .ppt-canvas-overlay.is-leaving {
      opacity: 0;
      /* 由 JS 还原到卡片尺寸 */
    }

    /* 全屏画布的背景装饰（深色渐变+网点+光晕） */
    .ppt-canvas-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(70, 120, 220, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 85%, rgba(232, 90, 26, 0.18) 0%, transparent 70%),
        linear-gradient(180deg, #070a14 0%, #0a0f24 40%, #07091a 100%);
    }
    .ppt-canvas-bg::after {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.7;
    }

    /* 关闭按钮 */
    .ppt-canvas-close {
      position: absolute;
      top: 28px;
      right: 32px;
      z-index: 50;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s ease;
    }
    .ppt-canvas-close:hover {
      background: rgba(232, 90, 26, 0.25);
      border-color: #e85a1a;
      transform: rotate(90deg) scale(1.08);
    }
    /* 画布顶部提示 */
    .ppt-canvas-tip {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
    }
    .ppt-canvas-title {
      position: absolute;
      top: 26px;
      left: 36px;
      z-index: 50;
      font-family: 'Poppins', 'Noto Sans SC', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.2em;
    }
    .ppt-canvas-title em {
      color: #e85a1a;
      font-style: normal;
      margin-left: 6px;
    }

    /* 无限画布网格容器 */
    .ppt-canvas-stage {
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      cursor: grab !important;
      touch-action: none;  /* 移动端：手势完全由 JS 接管，避免浏览器预判滚动导致卡顿/跳动 */
    }
    .ppt-canvas-stage:active {
      cursor: grabbing !important;
    }
    /* 实际装卡片的滚动层（使用 translate 代替 DOM 滚动） */
    .ppt-canvas-grid {
      position: absolute;
      left: 0;
      top: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      padding: 120px 60px 60px;
      /* 网格宽度 = 4卡片 + 3间距 + 左右padding，确保至少 2 个屏幕宽高的内容量
         由 JS 设置 width/height 以确保无限循环 */
    }

    /* 单个 PPT 卡片 —— 深色沉浸 + 虚线边框 + Hover 光晕 */
    .ppt-card {
      position: relative;
      width: 320px;
      height: 180px;
      border-radius: 14px;
      border: 1.5px dashed rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      cursor: pointer !important;
      transition: scale 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.3s ease,
                  filter 0.3s ease !important;
      will-change: transform;
      transform: translateZ(0);  /* 强制提升到 GPU 合成层，移动端避免重复光栅化 */
      user-select: none;
      flex-shrink: 0;
    }
    /* Hover：橙色光晕 + 轻微抬升 + 虚线颜色加深 */
    .ppt-card::before {
      content: '';
      position: absolute;
      inset: -25%;
      background: radial-gradient(circle at 50% 50%,
        rgba(232, 90, 26, 0.45) 0%,
        rgba(100, 150, 255, 0.22) 42%,
        transparent 72%);
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      filter: blur(12px);
      z-index: 0;
      pointer-events: none;
    }
    .ppt-card:hover {
      scale: 1.03 !important;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.3) !important;
      filter: brightness(1.15) !important;
      z-index: 10 !important;
      border-color: rgba(232, 90, 26, 0.85);
    }
    .ppt-card:hover::before {
      opacity: 1;
      transform: scale(1.15);
    }
    /* 彩色渐变兜底层（图片加载失败时作为备用视觉） */
    .ppt-card-bg {
      position: absolute; inset: 0;
      z-index: 1;
    }

                  <img key={i} src={src} alt={`展示图${i + 1}`} className="workflow-image-item" loading="lazy" />
                ))}
              </div>
            </div>
          )}

          {/* 03 在线服务平台弹窗（标题+链接+双图） */}
          {isPlatformModalOpen && platformData && (
            <div className="platform-modal" onClick={() => setIsPlatformModalOpen(false)}>
              <div className="platform-modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="platform-modal-close" onClick={() => setIsPlatformModalOpen(false)} title="关闭">×</button>
                <h3 className="platform-modal-title">{platformData.title}</h3>
                <a href={platformData.link} target="_blank" rel="noopener noreferrer" className="platform-modal-link">{platformData.link}</a>
                {platformData.images.map((src, i) => (
                  <img key={i} src={src} alt={`ImgForge 展示图 ${i + 1}`} className="platform-modal-img" loading="lazy" />
                ))}
              </div>
            </div>
          )}
        </section>
      );
    };

    // ===== PPT展示模块：入口卡片 → 全屏无限画布 =====
    const PptShowcase = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [isAnimating, setIsAnimating] = useState(false);
      const entryRef = useRef(null);           // 入口卡片 DOM
      const overlayRef = useRef(null);         // 全屏蒙层 DOM
      const stageRef = useRef(null);           // 画布舞台 DOM
      const gridRef = useRef(null);            // 网格容器 DOM
      // 每卡片的元数据：{ node, baseX, baseY, offX, offY } —— 参考仓库的每卡片独立跟踪偏移的思路
      const cardMeta = useRef([]);
      // 当前累积偏移（上/下/左/右的虚拟位移）
      const cam = useRef({ x: 0, y: 0 });
      // 尺寸常量（与 CSS 响应式同步）—— 4×4 网格容纳 16 张 PPT
      const dims = useRef({ cardW: 320, cardH: 180, gap: 28, cols: 4, rows: 4, paddingX: 60, paddingY: 120 });
      // rAF 帧号
      const rafRef = useRef(0);
      const wheelAcc = useRef({ x: 0, y: 0 });
      // 统一指针状态：兼容鼠标 + 触摸（拖拽惯性 + 点击vs拖拽判定）
      const pointerState = useRef({ active: false, startX: 0, startY: 0, lastX: 0, lastY: 0, vx: 0, vy: 0, isDragging: false });

      const TOTAL = 16;

      // 当前被点击居中放大的图片
      const [selectedPpt, setSelectedPpt] = useState(null);

      // ========== 1. 计算当前响应式卡片尺寸（与 CSS media query 同步） ==========
      const recomputeDims = () => {
        const w = window.innerWidth;
        let cardW = 320, cardH = 180;
        if (w >= 1280) { cardW = 400; cardH = 225; }
        else if (w >= 900)  { cardW = 360; cardH = 202; }
        else if (w <= 560)  { cardW = 240; cardH = 135; }  // 移动端：减小尺寸降低像素填充压力
        dims.current = { ...dims.current, cardW, cardH };
      };

      // ========== 2. FLIP 无缝展开 / 收起 ==========
      const openCanvas = () => {
        if (isAnimating || isOpen) return;
        setIsAnimating(true);
        // First：记录入口卡片在屏幕的位置
        const rect = entryRef.current.getBoundingClientRect();
        const scaleX = rect.width / window.innerWidth;
        const scaleY = rect.height / window.innerHeight;
        const translateX = rect.left + rect.width / 2 - window.innerWidth / 2;
        const translateY = rect.top + rect.height / 2 - window.innerHeight / 2;

        // 先挂到 DOM 上
        setIsOpen(true);
        // 等 DOM 挂载完成（下一帧）后设置初始态
        requestAnimationFrame(() => {
          // 关键修复：必须在 setIsOpen(true) 触发 React 渲染、overlay 挂载到 DOM 之后
          // 再读取 overlayRef.current，否则拿到的是 null，导致整个动画链路断裂
          const overlay = overlayRef.current;
          if (!overlay) {
            // 极端情况下 DOM 还没就绪：降级直接显示，不卡死 isAnimating
            setIsAnimating(false);
            initCanvas();
            return;
          }
          // Last（反向施加变换 → Invert）：让全屏容器先"缩"到入口卡片的位置
          overlay.classList.remove('is-open', 'is-leaving');
          overlay.classList.add('is-entering');
          overlay.style.opacity = '0.85';
          overlay.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleX}, ${scaleY})`;
          overlay.style.borderRadius = '22px';
          // 强制 reflow
          overlay.offsetHeight;
          // Play：移除 invert，让它自然过渡到全屏
          requestAnimationFrame(() => {
            overlay.classList.add('is-open');
            overlay.classList.remove('is-entering');
            overlay.style.opacity = '';
            overlay.style.transform = '';
            overlay.style.borderRadius = '';
            // 动画结束后清理
            setTimeout(() => {
              setIsAnimating(false);
              initCanvas();   // 等展开完成再初始化网格与滚轮
            }, 720);
          });
        });
      };

      const closeCanvas = () => {
        if (isAnimating || !isOpen) return;
        setIsAnimating(true);
        const rect = entryRef.current.getBoundingClientRect();
        const overlay = overlayRef.current;
        const scaleX = rect.width / window.innerWidth;
        const scaleY = rect.height / window.innerHeight;
        const translateX = rect.left + rect.width / 2 - window.innerWidth / 2;
        const translateY = rect.top + rect.height / 2 - window.innerHeight / 2;

        overlay.classList.add('is-leaving');
        overlay.classList.remove('is-open');
        overlay.style.opacity = '0';
        overlay.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleX}, ${scaleY})`;
        overlay.style.borderRadius = '22px';

        teardownCanvas();
        setTimeout(() => {
          setIsOpen(false);
          overlay.classList.remove('is-leaving', 'is-entering');
          overlay.style.opacity = '';
          overlay.style.transform = '';
          overlay.style.borderRadius = '';
          setIsAnimating(false);
          // 重置镜头
          cam.current = { x: 0, y: 0 };
        }, 720);
      };

      // ESC 快捷键关闭（模态框优先 → 再关画布）
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => {
          if (e.key === 'Escape') {
            if (selectedPpt) {
              setSelectedPpt(null);
            } else {
              closeCanvas();
            }
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, selectedPpt]);

      // ========== 3. 画布初始化 / 销毁（16 张卡片 + 每卡片跟踪偏移） ==========
      const initCanvas = () => {
        recomputeDims();
        const { cardW, cardH, gap, cols, rows, paddingX, paddingY } = dims.current;

        // 给 grid 足够大的尺寸（让 16 张卡片正常铺开）
        if (gridRef.current) {
          gridRef.current.style.width = (cols * cardW + (cols - 1) * gap + paddingX * 2) + 'px';
          gridRef.current.style.height = (rows * cardH + (rows - 1) * gap + paddingY + 60) + 'px';
        }

        // 收集每卡片的基础坐标与偏移量，参考 JIEJOE 仓库：每卡片独立维护 baseX/Y 与 movX/Y
        const nodes = document.querySelectorAll('.ppt-canvas-grid .ppt-card');
        cardMeta.current = [];
        nodes.forEach((node, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const baseX = paddingX + col * (cardW + gap);
          const baseY = paddingY + row * (cardH + gap);
          cardMeta.current.push({ node, baseX, baseY, offX: 0, offY: 0 });
          // 初始位置
          node.style.transform = `translate(${baseX}px, ${baseY}px)`;
          node.style.position = 'absolute';
          node.style.left = '0';
          node.style.top = '0';
        });

        // 绑定滚轮与 rAF 循环
        wheelAcc.current = { x: 0, y: 0 };
        cam.current = { x: 0, y: 0 };
        pointerState.current = { active: false, startX: 0, startY: 0, lastX: 0, lastY: 0, vx: 0, vy: 0, isDragging: false };
        // 统一指针事件：touch + mouse 都走 onPointerDown/Move/Up
        stageRef.current.addEventListener('wheel', onWheel, { passive: false });
        stageRef.current.addEventListener('touchstart', onPointerDown, { passive: false });
        stageRef.current.addEventListener('touchmove',  onPointerMove,  { passive: false });
        stageRef.current.addEventListener('touchend',   onPointerUp,    { passive: false });
        stageRef.current.addEventListener('mousedown',  onPointerDown);
        // 鼠标 move/up 绑定在 document 上（拖拽时鼠标可能移出 stage）
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', onPointerUp);
        window.addEventListener('resize', onResize);
        rafRef.current = requestAnimationFrame(tick);
      };

      const teardownCanvas = () => {
        // 先标记为非活跃，让残留的 mousemove/mouseup 回调安全退出
        pointerState.current.active = false;
        if (stageRef.current) {
          stageRef.current.removeEventListener('wheel', onWheel);
          stageRef.current.removeEventListener('touchstart', onPointerDown);
          stageRef.current.removeEventListener('touchmove',  onPointerMove);
          stageRef.current.removeEventListener('touchend',   onPointerUp);
          stageRef.current.removeEventListener('mousedown',  onPointerDown);
        }
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        window.removeEventListener('resize', onResize);
        cancelAnimationFrame(rafRef.current);
      };

      const onResize = () => {
        // 重新计算卡片尺寸与基础坐标
        if (!isOpen) return;
        recomputeDims();
        const { cardW, cardH, gap, cols, rows, paddingX, paddingY } = dims.current;
        if (gridRef.current) {
          gridRef.current.style.width = (cols * cardW + (cols - 1) * gap + paddingX * 2) + 'px';
          gridRef.current.style.height = (rows * cardH + (rows - 1) * gap + paddingY + 60) + 'px';
        }
        cardMeta.current.forEach((m, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          m.baseX = paddingX + col * (cardW + gap);
          m.baseY = paddingY + row * (cardH + gap);
        });
      };

      // ========== 4. 滚轮：累积 delta，再由 rAF 平滑消费 ==========
      const onWheel = (e) => {
        e.preventDefault();
        // 滚轮上下 → 主要作用在 Y 轴；按住 Shift 时转为横向（Windows 常见）
        if (e.shiftKey) {
          wheelAcc.current.x += e.deltaY || e.deltaX;
        } else {
          wheelAcc.current.x += (e.deltaX || 0);
          wheelAcc.current.y += (e.deltaY || 0);
        }
      };

      // ========== 4.1 统一指针事件：兼容鼠标 + 触摸的拖拽滑动 ==========

      // 兼容获取指针坐标：e.touches[0]（触摸）或 e.clientX/Y（鼠标）
      const getPointerPos = (e) => {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      };

      // 指针按下（mousedown / touchstart 共用）
      const onPointerDown = (e) => {
        if (e.button === 2) return;  // 忽略右键
        e.preventDefault();          // 防止图片默认拖拽行为
        const pos = getPointerPos(e);
        pointerState.current.active = true;
        pointerState.current.startX = pos.x;
        pointerState.current.startY = pos.y;
        pointerState.current.lastX = pos.x;
        pointerState.current.lastY = pos.y;
        pointerState.current.vx = 0;
        pointerState.current.vy = 0;
        pointerState.current.isDragging = false;
        // 清空历史惯性，避免新旧手感打架
        wheelAcc.current.x = 0;
        wheelAcc.current.y = 0;
      };

      // 指针移动（mousemove / touchmove 共用）
      const onPointerMove = (e) => {
        if (!pointerState.current.active) return;
        e.preventDefault();
        const pos = getPointerPos(e);
        const dx = pos.x - pointerState.current.lastX;
        const dy = pos.y - pointerState.current.lastY;
        pointerState.current.lastX = pos.x;
        pointerState.current.lastY = pos.y;
        // 移动距离超过 5px → 标记为拖拽（不是点击）
        if (Math.abs(pos.x - pointerState.current.startX) > 5 ||
            Math.abs(pos.y - pointerState.current.startY) > 5) {
          pointerState.current.isDragging = true;
        }
        // 偏移量累加到 wheelAcc（rAF 每帧消费）
        wheelAcc.current.x += dx;
        wheelAcc.current.y += dy;
        // 记录瞬时速度（松手后用做惯性初速度，低通滤波更顺滑）
        pointerState.current.vx = pointerState.current.vx * 0.7 + dx * 0.3;
        pointerState.current.vy = pointerState.current.vy * 0.7 + dy * 0.3;
      };

      // 指针抬起（mouseup / touchend 共用）
      const onPointerUp = (e) => {
        pointerState.current.active = false;
        // 松手后：vx/vy 已经在 move 中低通过，交给 tick() 做惯性衰减
      };

      // ========== 4.2 点击拦截：拖拽中不触发点击放大 ==========
      const handleCardClick = (imgSrc, title) => {
        // 如果刚刚在拖拽 → 忽略这次点击
        if (pointerState.current.isDragging) return;
        setSelectedPpt({ imgSrc, title });
      };

      // ========== 5. 无限画布核心：每帧应用偏移，并处理边缘穿越 ==========
      const tick = () => {
        const { cardW, cardH, gap, cols, rows } = dims.current;
        const stageW = stageRef.current ? stageRef.current.clientWidth : window.innerWidth;
        const stageH = stageRef.current ? stageRef.current.clientHeight : window.innerHeight;
        // 1 组卡片的总跨度（cols×rows 网格 = 一个平铺单元）
        const gridW = cols * cardW + (cols - 1) * gap;
        const gridH = rows * cardH + (rows - 1) * gap;

        // —— 指针惯性：松开后（active=false），将上一次拖动的末速度按 0.92 每帧衰减并注入 wheelAcc，形成自然滑行 ——
        const ps = pointerState.current;
        if (!ps.active && (Math.abs(ps.vx) > 0.15 || Math.abs(ps.vy) > 0.15)) {
          wheelAcc.current.x += ps.vx;
          wheelAcc.current.y += ps.vy;
          ps.vx *= 0.92;
          ps.vy *= 0.92;
        } else if (!ps.active) {
          ps.vx = 0;
          ps.vy = 0;
        }

        // 平滑消费累加量（lerp 衰减 → 轻微惯性）
        cam.current.x += wheelAcc.current.x;
        cam.current.y += wheelAcc.current.y;
        wheelAcc.current.x *= 0.08;
        wheelAcc.current.y *= 0.08;
        if (Math.abs(wheelAcc.current.x) < 0.1) wheelAcc.current.x = 0;
        if (Math.abs(wheelAcc.current.y) < 0.1) wheelAcc.current.y = 0;

        // ========== 无限滚动核心逻辑（参考 JIEJOE 仓库：穿越边缘即复位偏移） ==========
        // 当某卡片 + 当前镜头 完全超出容器右边界 → 将其 baseX 减掉 1 个网格宽度（去左边）
        // 同理处理 4 个方向
        cardMeta.current.forEach((m) => {
          let realX = m.baseX + cam.current.x + m.offX;
          let realY = m.baseY + cam.current.y + m.offY;

          // —— 水平方向循环 ——
          if (realX > stageW + cardW * 0.2) {
            // 飘出右边 → 搬回左边（减一整个网格宽度）
            m.offX -= gridW;
            realX -= gridW;
          } else if (realX + cardW < -cardW * 0.2) {
            // 飘出左边 → 搬回右边（加一整个网格宽度）
            m.offX += gridW;
            realX += gridW;
          }

          // —— 垂直方向循环 ——
          if (realY > stageH + cardH * 0.2) {
            m.offY -= gridH;
            realY -= gridH;
          } else if (realY + cardH < -cardH * 0.2) {
            m.offY += gridH;
            realY += gridH;
          }

          // 应用最终位置（直接 transform → GPU 合成，无 reflow）
          m.node.style.transform = `translate(${realX}px, ${realY}px)`;
        });

        rafRef.current = requestAnimationFrame(tick);
      };

      // ========== 6. 渲染：16 张本地 PPT 图片（断网降级为彩色渐变） ==========
      // 16 个 PPT 作品的预设标题；后续替换为真实标题即可
      const workTitles = [
        '法律科技 · 解决方案', '数据合规白皮书',    'AI 法律咨询系统',   '法学课程教学课件',
        '合同审查工具 V1.0',  '智能风控报告',      '企业合规年报',      '大模型司法评测',
        '法律知识图谱',      'AI + Law 路演',     '跨境数据合规方案',  '普法宣传手册',
        '律师事务所品牌',    '法学论文答辩',      '法律科技创业计划',  'AI 法条检索工具',
      ];
      // 16 组预设配色（无法加载图片时作为彩色渐变兜底）
      const workGradients = [
        ['#0d2147','#2563eb'], ['#1a1a2e','#e94560'], ['#0f4c5c','#e36414'], ['#13293d','#006494'],
        ['#3d2b3d','#b56b6b'], ['#1c2541','#3a506b'], ['#2e294e','#f46036'], ['#065f46','#05b189'],
        ['#1f2833','#66fcf1'], ['#533a71','#e2a0ff'], ['#003459','#00a8e8'], ['#323232','#ff8a00'],
        ['#1a73a8','#63d2ff'], ['#2b2d42','#ef233c'], ['#0f7173','#f05d5e'], ['#581c87','#f59e0b'],
      ];

      const renderCards = () => {
        const arr = [];
        for (let i = 1; i <= TOTAL; i++) {
          const idx = String(i).padStart(2, '0');
          const [c1, c2] = workGradients[i - 1];
          // 本地 PPT 缩略图（ppt-page1.png ~ ppt-page16.png）
          const imgSrc = `ppt-page${i}.png`;
          arr.push(
            <div key={i} className="ppt-card" onClick={() => handleCardClick(imgSrc, workTitles[i - 1])}>
              {/* 彩色渐变兜底层（picsum 加载失败 / 断网时显示） */}
              <div
                className="ppt-card-bg"
                style={{
                  background: `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`,
                }}
                aria-hidden
              />
              {/* 真实图片层；加载失败时 onError 隐藏 → 显示下方渐变 + 标题占位 */}
              <img
                className="ppt-card-img"
                src={imgSrc}
                alt={workTitles[i - 1]}
                loading="lazy"
                onError={(e) => { e.currentTarget.style.opacity = '0'; }}
              />
              {/* 序号徽章（左上角） */}
              <div className="ppt-card-badge-idx">{idx}</div>
            </div>
          );
        }
        return arr;
      };

      return (
        <section id="ppt" className="ppt-section">
          <div className="section-inner">
            {/* 头部 */}
            <div className="ppt-kicker">
              <span className="ppt-kicker-icon" aria-hidden />
              <span>PRESENTATION</span>
              <span className="ppt-kicker-slash">//</span>
              <span className="ppt-kicker-cn">PPT作品展示</span>
            </div>
            <h1 className="ppt-main-title">
              PPT作品展示<span className="ppt-dot">。</span>
            </h1>

            {/* 入口卡片：只有点击"开启沉浸式浏览"才进入无限画布 */}
            <div
              ref={entryRef}
              className="ppt-entry-card"
            >
              <div className="ppt-entry-inner">
                <div className="ppt-entry-count">COLLECTION · 16 WORKS</div>
                <div className="ppt-entry-title">PPT 设计作品集</div>
                <div className="ppt-entry-sub">点击下方按钮进入 · 无限画布浏览模式</div>
                <div
                  className="ppt-entry-hint"
                  onClick={openCanvas}
                  role="button"
                  aria-label="开启沉浸式浏览"
                  tabIndex={0}
                  onKeyDown={(e) => (e.key === 'Enter' || e.key === ' ') && openCanvas()}
                >
                  开启沉浸式浏览
                  <span className="ppt-entry-hint-arrow">→</span>
                </div>
              </div>
            </div>
          </div>

          {/* 全屏无限画布蒙层（用原生 DOM 保证 position: fixed 的准确性） */}
          {isOpen && ReactDOM.createPortal(
            <div
              ref={overlayRef}
              className="ppt-canvas-overlay"
              role="dialog"
              aria-modal="true"
              aria-label="PPT作品无限画布"
            >
              {/* 深色沉浸式背景 */}
              <div className="ppt-canvas-bg" aria-hidden="true" />

              {/* 顶部 UI：标题 / 提示 / 关闭 */}
              <div className="ppt-canvas-title">PPT WORKS <em>· 16 / 16</em></div>
              <div className="ppt-canvas-tip">↕ SCROLL TO EXPLORE · 无限延展</div>
              <button
                className="ppt-canvas-close"
                onClick={closeCanvas}
                aria-label="关闭并返回"
              >
                ✕
              </button>

              {/* 可滚动舞台 */}
              <div className="ppt-canvas-stage" ref={stageRef}>
                <div className="ppt-canvas-grid" ref={gridRef}>
                  {renderCards()}
                </div>
              </div>

              {/* 单张图片放大居中展示模态框（常驻 DOM + CSS 过渡动画） */}
              <div
                className={`ppt-detail-modal ${selectedPpt ? 'is-open' : ''}`}
                onClick={() => setSelectedPpt(null)}
              >
                {selectedPpt && (
                  <div className="ppt-detail-content" onClick={e => e.stopPropagation()}>

                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

                    <polygon points="22 2 15 22 11 13 2 9 22 2" />

            </div>
          </div>

      );
    };

    // ===== 自定义光标组件 =====
    const CustomCursor = ({ disabled }) => {
      const dotRef = useRef(null);       // 内部黑色圆点（实时跟随）
      const ringRef = useRef(null);      // 外部黑色圆圈（延迟跟随）

      useEffect(() => {
        if (disabled) {
          if (dotRef.current) dotRef.current.style.opacity = '0';
          if (ringRef.current) ringRef.current.style.opacity = '0';
          return;
        } else {
          if (dotRef.current) dotRef.current.style.opacity = '1';
          if (ringRef.current) ringRef.current.style.opacity = '1';
        }
      }, [disabled]);

      useEffect(() => {
        // 鼠标/触摸 当前坐标（目标位置）
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        // 圆圈当前坐标（实际渲染位置）
        let ringX = mouseX;
        let ringY = mouseY;

        // 0.1 秒延迟的插值系数：60fps 下约 0.25 可实现 ~0.1s 的细微滞后感
        const LERP_FACTOR = 0.25;
        let rafId = null;

        // 统一更新位置（鼠标+触摸共用）
        const updatePos = (x, y) => {
          mouseX = x;
          mouseY = y;
          if (dotRef.current) {
            dotRef.current.style.left = mouseX + 'px';
            dotRef.current.style.top = mouseY + 'px';
          }
        };

        // 设置光标可见/隐藏（触摸按下显示，抬起隐藏）
        const setCursorVisible = (visible) => {
          const opacity = visible ? '1' : '0';
          if (dotRef.current) dotRef.current.style.opacity = opacity;
          if (ringRef.current) ringRef.current.style.opacity = opacity;
        };

        // 桌面端：mousemove 实时跟随
        const moveCursor = (e) => {
          updatePos(e.clientX, e.clientY);
        };

        // 移动端：touchstart 显示并跟随
        const handleTouchStart = (e) => {
          if (e.touches.length > 0) {
            const t = e.touches[0];
            updatePos(t.clientX, t.clientY);
            setCursorVisible(true);
          }
        };

        // 移动端：touchmove 跟随
        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            const t = e.touches[0];
            updatePos(t.clientX, t.clientY);
          }
        };

        // 移动端：touchend 隐藏光标
        const handleTouchEnd = () => {
          setCursorVisible(false);
        };

        // 外部圆圈：用 requestAnimationFrame + lerp 实现平滑延迟
        const animateRing = () => {
          ringX += (mouseX - ringX) * LERP_FACTOR;
          ringY += (mouseY - ringY) * LERP_FACTOR;
          if (ringRef.current) {
            ringRef.current.style.left = ringX + 'px';
            ringRef.current.style.top = ringY + 'px';
          }
          rafId = requestAnimationFrame(animateRing);
        };

        document.addEventListener('mousemove', moveCursor);
        document.addEventListener('touchstart', handleTouchStart, { passive: true });
        document.addEventListener('touchmove', handleTouchMove, { passive: true });
        document.addEventListener('touchend', handleTouchEnd, { passive: true });
        rafId = requestAnimationFrame(animateRing);

        return () => {
          document.removeEventListener('mousemove', moveCursor);
          document.removeEventListener('touchstart', handleTouchStart);
          document.removeEventListener('touchmove', handleTouchMove);
          document.removeEventListener('touchend', handleTouchEnd);
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, []);

      return (
        <>
          {/* 外部黑色圆圈：延迟跟随 */}
          <div
            ref={ringRef}
            className="custom-cursor"
            style={{
              position: 'fixed',
              pointerEvents: 'none',
              zIndex: 9998,
              transform: 'translate(-50%, -50%)',
              width: '40px',
              height: '40px',
              borderRadius: '50%',
              border: '2px solid #000000',
              backgroundColor: 'transparent',
              transition: 'opacity 0.15s ease',
            }}
          />
          {/* 内部黑色圆点：实时跟随 */}
          <div
            ref={dotRef}
            className="custom-cursor"
            style={{
              position: 'fixed',
              pointerEvents: 'none',
              zIndex: 9999,
              transform: 'translate(-50%, -50%)',
              width: '10px',
              height: '10px',
              borderRadius: '50%',
              backgroundColor: '#000000',
              transition: 'opacity 0.15s ease',
            }}
          />
        </>
      );
    };

    // ===== 右上角音乐播放器 =====
    const MusicPlayer = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const [showTitle, setShowTitle] = useState(false);
      const [volume, setVolume] = useState(0.7);
      const [showVolume, setShowVolume] = useState(false);
      const audioRef = useRef(null);
      const hasAutoPlayTry = useRef(false);

      // 页面加载后尝试自动播放；若被浏览器阻止，则在首次用户交互时恢复播放
      useEffect(() => {
        const tryPlay = async () => {
          if (!audioRef.current) return;
          try {
            await audioRef.current.play();
            setIsPlaying(true);
          } catch {
            const resume = async () => {
              if (audioRef.current && !hasAutoPlayTry.current) {
                hasAutoPlayTry.current = true;
                try {
                  await audioRef.current.play();
                  setIsPlaying(true);
                } catch {}
                document.removeEventListener('click', resume);
                document.removeEventListener('keydown', resume);
                document.removeEventListener('touchstart', resume);
              }
            };
            document.addEventListener('click', resume);
            document.addEventListener('keydown', resume);
            document.addEventListener('touchstart', resume);
          }
        };
        tryPlay();
      }, []);

      // 同步音量到 audio 元素
      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = volume;
        }
      }, [volume]);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
        } else {
          audioRef.current.play();
        }
        setIsPlaying(!isPlaying);
      };

      return (
        <div className="top-right-music-widget">
          <audio ref={audioRef} src="Fogged%20Window%20Lullaby.mp3" loop preload="metadata" />

          <div className={`music-title-tooltip ${showTitle ? 'active' : ''}`}>
            <span>Fogged Window Lullaby</span>
          </div>

          <div className="music-player-bar">
            <button
              className="music-icon-btn"
              onClick={() => setShowTitle(!showTitle)}
              title="显示/隐藏歌名"
            >
              🎵
            </button>

            <button className="music-ctrl-btn" title="上一曲" onClick={() => { if(audioRef.current){ audioRef.current.currentTime = 0; } }}>
              ⏮
            </button>

            <button className="music-play-btn" onClick={togglePlay} title={isPlaying ? '暂停' : '播放'}>
              {isPlaying ? '⏸' : '▶'}
            </button>

            <button className="music-ctrl-btn" title="下一曲" onClick={() => { if(audioRef.current){ audioRef.current.currentTime = 0; audioRef.current.play(); setIsPlaying(true); } }}>
              ⏭
            </button>

            <div className="music-volume-wrap">
              <button className="music-ctrl-btn" onClick={() => setShowVolume(!showVolume)} title="音量">
                🔊
              </button>
              {showVolume && (
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.05"
                  value={volume}
                  onChange={(e) => setVolume(parseFloat(e.target.value))}
                  className="music-volume-slider"
                />
              )}
            </div>
          </div>
        </div>
      );
    };

    // ===== 主 App =====
    const App = () => (
      <>
        <Navbar />
        <Hero />
        <Profile />
        <Projects />
        <Advantages />
        <Practice />
        <PptShowcase />
        <MediaSection />
        <GratitudeSection />
        <ContactSection />
        <MusicPlayer />
        <CustomCursor />
      </>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>);
  </script>
